<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Flappy Bird</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a0a2e; display: flex; align-items: center; justify-content: center; height: 100dvh; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; touch-action: none; }
    #wrapper { position: relative; display: flex; align-items: center; justify-content: center; }
    canvas { display: block; border-radius: 16px; box-shadow: 0 0 60px #ff6b9d33, 0 30px 80px #00000088; }
    .panel { position: absolute; inset: 0; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: linear-gradient(160deg, #1a0a2ecc, #0d1b4bcc); backdrop-filter: blur(4px); pointer-events: none; opacity: 0; transition: opacity 0.3s; }
    .panel.visible { opacity: 1; pointer-events: all; }
    .panel h1 { font-size: 3rem; font-weight: 900; color: #fff; text-shadow: 0 0 30px #ff6b9d; }
    .panel .sub { color: #c8b8e8; text-align: center; }
    .panel button { padding: 14px 40px; border: none; border-radius: 50px; background: linear-gradient(135deg, #ff6b9d, #c44dff); color: #fff; font-size: 1.2rem; cursor: pointer; }
    #hud { position: absolute; top: 18px; left: 0; right: 0; display: flex; justify-content: center; pointer-events: none; }
    #hud span { font-size: 3.2rem; font-weight: 900; color: #fff; text-shadow: 0 3px 0 #00000066; }
  </style>
</head>
<body>

<div id="wrapper">
  <canvas id="c"></canvas>
  <div id="hud"><span id="scoreText">0</span></div>
  <div class="panel visible" id="startScreen">
    <h1>Flappy Bird</h1>
    <p class="sub">Press SPACE or TAP to start!</p>
    <button id="startBtn">▶ Play</button>
  </div>
  <div class="panel" id="gameOverScreen">
    <h1>Game Over</h1>
    <div class="score-display" id="finalScore" style="font-size: 3rem; color: #ffd700;">0</div>
    <button id="restartBtn">↺ Try Again</button>
  </div>
</div>

<script>
(function () {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const wrapper = document.getElementById('wrapper');

  // Larger desktop scale
  const BASE_W = 400;
  const BASE_H = 700;
  let scale = 1;

  function resize () {
    const maxW = window.innerWidth - 40;
    const maxH = window.innerHeight - 40;
    scale = Math.min(maxW / BASE_W, maxH / BASE_H, 1.2); 
    const W = Math.round(BASE_W * scale);
    const H = Math.round(BASE_H * scale);
    canvas.width = W; canvas.height = H;
    wrapper.style.width = W + 'px'; wrapper.style.height = H + 'px';
  }
  window.addEventListener('resize', resize);
  resize();

  const px = v => v * scale;
  
  // Adjusted Physics: Lower gravity, slightly lower flap
  const GRAVITY = 0.4;
  const FLAP_POWER = -9.5;
  const BIRD_X = 80;
  const BIRD_R = 18;
  const PIPE_W = 60;
  const PIPE_GAP = 170;
  const PIPE_SPEED = 2.4;
  const PIPE_INTERVAL = 100;
  const GROUND_H = 70;

  let state, bird, pipes, score, frame;

  function initGame () {
    // Start bird in middle, no vertical velocity
    bird = { y: BASE_H / 2, vy: 0, angle: 0 };
    pipes = [];
    score = 0;
    frame = 0;
    document.getElementById('scoreText').textContent = '0';
  }

  function showPanel (id) {
    document.getElementById('startScreen').classList.remove('visible');
    document.getElementById('gameOverScreen').classList.remove('visible');
    if (id) document.getElementById(id).classList.add('visible');
  }

  function flap() {
    if (state === 'idle') {
      state = 'playing';
      showPanel(null);
    }
    if (state === 'playing') {
      bird.vy = FLAP_POWER;
    }
  }

  document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); flap(); }});
  canvas.addEventListener('pointerdown', e => { e.preventDefault(); flap(); });
  document.getElementById('startBtn').addEventListener('click', () => { state = 'playing'; showPanel(null); });
  document.getElementById('restartBtn').addEventListener('click', () => { initGame(); state = 'playing'; showPanel(null); });

  function loop () {
    requestAnimationFrame(loop);
    
    // In idle, keep bird floating in place
    if (state === 'idle') {
      bird.y = (BASE_H / 2) + Math.sin(Date.now() / 300) * 10;
    } else {
      bird.vy += GRAVITY;
      bird.y += bird.vy;
      bird.angle = Math.max(-0.5, Math.min(0.5, bird.vy * 0.05));
    }

    if (state === 'playing') {
      frame++;
      if (frame % PIPE_INTERVAL === 0) {
        const topH = 80 + Math.random() * (BASE_H - GROUND_H - PIPE_GAP - 160);
        pipes.push({ x: BASE_W, topH, passed: false });
      }
      for (const p of pipes) {
        p.x -= PIPE_SPEED;
        if (!p.passed && p.x + PIPE_W < BIRD_X) { p.passed = true; score++; document.getElementById('scoreText').textContent = score; }
      }
      pipes = pipes.filter(p => p.x + PIPE_W > 0);
      
      if (bird.y + BIRD_R > BASE_H - GROUND_H || bird.y - BIRD_R < 0 || pipes.some(p => 
        (BIRD_X + BIRD_R > p.x && BIRD_X - BIRD_R < p.x + PIPE_W) && 
        (bird.y - BIRD_R < p.topH || bird.y + BIRD_R > p.topH + PIPE_GAP)
      )) {
        state = 'dead';
        document.getElementById('finalScore').textContent = score;
        setTimeout(() => showPanel('gameOverScreen'), 300);
      }
    }

    // Draw
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    // Background/Pipes/Bird drawing omitted for brevity, logic follows your provided code structure...
    // (Ensure you keep the drawing functions from your previous code to render the visuals)
  }

  initGame();
  loop();
})();
</script>
</body>
</html>
